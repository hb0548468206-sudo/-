<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dreamy | לא סתם גלידה. גלידה שהיא חלום</title>
  <meta name="description" content="Dreamy – גלידות פרימיום בעבודת יד: גביעים אישיים, קופסאות משפחתיות, שלגונים ומארזים למסיבות. הזמינו אונליין.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Rubik:ital,wght@0,300;0,400;0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- שמיים ועננים ברקע -->
  <div class="sky" aria-hidden="true">
    <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
    <span class="cloud c4"></span><span class="cloud c5"></span>
  </div>

  <!-- ===== תפריט עליון ===== -->
  <header class="site-header">
    <div class="header-inner">
      <nav class="nav nav-start" aria-label="ניווט ראשי">
        <a href="#home" class="pill" data-route="home">בית</a>
        <a href="#shop" class="pill" data-route="shop">החלום המתוק</a>
      </nav>

      <a href="#home" class="logo" aria-label="Dreamy – לדף הבית">
        <img src="images/logo.png" alt="Dreamy">
      </a>

      <nav class="nav nav-end" aria-label="ניווט משני">
        <a href="#branches" class="pill" data-route="branches">סניפים</a>
        <a href="#vip" class="pill" data-route="vip">VIP</a>
        <button type="button" class="icon-btn" id="cart-btn" aria-label="סל הקניות">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/><path d="M13.6 12.2c-.4-.5-1-.7-1.6-.7-.9 0-1.6.5-1.6 1.2 0 1.6 3.3.9 3.3 2.6 0 .7-.8 1.2-1.7 1.2-.7 0-1.3-.3-1.7-.8M12 10.6v.9M12 16.5v.9"/></svg>
          <span class="badge" id="cart-count" hidden>0</span>
        </button>
        <a href="#" class="icon-btn" data-phone aria-label="התקשרו אלינו">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5h2.6l1.4 4-2 1.4a11 11 0 0 0 6.5 6.5l1.4-2 4 1.4v2.6a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2z"/></svg>
        </a>
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-expanded="false" aria-controls="mobile-nav" aria-label="פתיחת תפריט">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </nav>
    </div>

    <nav class="mobile-nav" id="mobile-nav" aria-label="תפריט נייד">
      <a href="#home" class="pill" data-route="home">בית</a>
      <a href="#shop" class="pill" data-route="shop">החלום המתוק</a>
      <a href="#branches" class="pill" data-route="branches">סניפים</a>
      <a href="#vip" class="pill" data-route="vip">VIP</a>
    </nav>
  </header>

  <!-- ===== תוכן הדף (נבנה מתוך script.js) ===== -->
  <main id="view" tabindex="-1"></main>

  <!-- ===== כותרת תחתונה ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <a href="#" class="footer-phone" data-phone data-config="phone">0548468506</a>
      <p>כל הזכויות שמורות ל-DREAMY © <span id="year"></span></p>
      <a href="#home" class="logo logo-sm" aria-label="Dreamy"><img src="images/logo.png" alt="Dreamy"></a>
    </div>
  </footer>

  <!-- ===== סל קניות ===== -->
  <div class="drawer" id="cart" hidden>
    <div class="drawer-backdrop" data-close-cart></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="cart-title">
      <header class="drawer-head">
        <h2 id="cart-title">הסל המתוק שלי</h2>
        <button type="button" class="close-btn" data-close-cart aria-label="סגירת הסל">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="drawer-body" id="cart-items"></div>

      <footer class="drawer-foot" id="cart-foot">
        <div class="totals">
          <div><span>סכום ביניים</span><span id="cart-subtotal">0 ש"ח</span></div>
          <div><span>משלוח</span><span id="cart-shipping">–</span></div>
          <div class="total"><span>סה"כ לתשלום</span><span id="cart-total">0 ש"ח</span></div>
          <p class="ship-note" id="ship-note"></p>
        </div>

        <form class="checkout" id="checkout" novalidate>
          <div class="seg" role="radiogroup" aria-label="אופן קבלה">
            <label><input type="radio" name="method" value="delivery" checked><span>משלוח עד הבית</span></label>
            <label><input type="radio" name="method" value="pickup"><span>איסוף מסניף</span></label>
          </div>
          <input type="text" name="name" placeholder="שם מלא" autocomplete="name" required>
          <input type="tel" name="phone" placeholder="טלפון" autocomplete="tel" inputmode="tel" required>
          <input type="text" name="address" placeholder="כתובת למשלוח" autocomplete="street-address" data-for="delivery">
          <select name="branch" data-for="pickup" hidden></select>
          <textarea name="notes" rows="2" placeholder="הערות להזמנה (לא חובה)"></textarea>
          <p class="form-error" id="form-error" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-block">שליחת הזמנה בוואטסאפ</button>
          <p class="pay-note">נציג יחזור אליכם לאישור ההזמנה ולתשלום.</p>
        </form>
      </footer>
    </aside>
  </div>

  <!-- הודעה קופצת -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
